# ===================================================================
# AI Resume Screener & ATS - Spring Boot Configuration
# ===================================================================

server.port=8080

# -------------------------------------------------------------------
# Database Configuration (H2 In-Memory with File Persistence by default)
# For MySQL production: Uncomment the MySQL lines below
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:screener_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MySQL Production Configuration (Uncomment when MySQL is running):
# spring.datasource.url=jdbc:mysql://localhost:3306/ats_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=rootpassword
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# Multipart File Upload Limits
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# -------------------------------------------------------------------
# AI Configuration (OpenAI API)
# Set your OPENAI_API_KEY as an environment variable or override below.
# If no key is provided, the application runs in High-Fidelity Mock Mode!
# -------------------------------------------------------------------
openai.api.key=${OPENAI_API_KEY:mock-key}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.api.model=gpt-4o-mini

# -------------------------------------------------------------------
# Storage Configuration (Local Disk Directory / AWS S3)
# -------------------------------------------------------------------
app.storage.local-dir=./uploads/resumes
aws.s3.bucket-name=${AWS_S3_BUCKET:resume-screener-uploads}
aws.s3.region=${AWS_REGION:us-east-1}

# -------------------------------------------------------------------
# CORS Configuration
# -------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://ganesh-badar.github.io
